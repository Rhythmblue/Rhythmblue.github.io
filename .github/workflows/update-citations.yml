name: Update citation counts

on:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * 0"

permissions:
  contents: write

jobs:
  update-citations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Update Google Scholar citation counts
        env:
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
        run: python scripts/update_citations.py

      - name: Commit citation updates
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update citation counts"
          file_pattern: index.html
